spring.application.name=lifeplanner

# PostgreSQL (ortam değişkenleriyle değiştirilebilir)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lifeplanner}
spring.datasource.username=${DB_USER:${USER}}
spring.datasource.password=${DB_PASSWORD:}

# Geliştirme aşamasında şema entity'lerden otomatik güncellenir.
# Yayına çıkmadan önce Flyway migration'larına geçilecek.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=8080

# Obsidian kasası (Bülten notları ve Kanallar.md)
lifeplanner.vault.path=${LIFEPLANNER_VAULT:${user.home}/Desktop/vault/batu/LifePlanner}
